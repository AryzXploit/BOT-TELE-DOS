services:
  - type: web
    name: aryzz-c2-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run c2-server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: API_KEY
        generateValue: true
    healthCheckPath: /api/health
